<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#800a0e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B47"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>
    <linearGradient id="vRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="50%" stop-color="#B81D24"/>
      <stop offset="100%" stop-color="#7A0E13"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Background Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Glowing Monogram V Group -->
  <g filter="url(#crimsonGlow)">
    <!-- Right Stem of V (Receding Facet) -->
    <polygon points="340,96 424,96 280,416 232,416" fill="url(#vRightGrad)"/>
    
    <!-- Left Stem of V (Dominant Dynamic Facet) -->
    <polygon points="88,96 172,96 280,416 196,416" fill="url(#vLeftGrad)"/>

    <!-- Sharp Top Accent Line -->
    <line x1="88" y1="96" x2="172" y2="96" stroke="#FFA4A9" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
